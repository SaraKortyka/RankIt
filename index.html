<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Menu</title>
<link rel="stylesheet" href="main-layout.css">
</head>
<body>

<!-- Top Controls -->
<div class="top-controls">
    <!-- Spiel Toggle -->
    <div class="toggle">
        <label class="switch">
            <input type="checkbox" id="spielToggle" checked>
            <span class="slider"></span>
        </label>
        <span>Spiel</span>
    </div>

    <!-- Koop / Solo Toggle -->
    <div class="toggle">
        <label class="switch">
            <input type="checkbox" id="koopToggle" checked>
            <span class="slider"></span>
        </label>
        <span>Koop Mode</span>
    </div>

    <!-- Language -->
    <div class="language-selector">
        <button class="flag-button" onclick="toggleLanguageMenu()" id="currentFlag">
            <!-- Standard: Deutschland -->
            <svg viewBox="0 0 24 16" class="flag-svg">
                <rect width="24" height="16" fill="#000"/>
                <rect width="24" height="10.66" y="5.33" fill="#dd0000"/>
                <rect width="24" height="5.33" y="10.66" fill="#ffce00"/>
            </svg>
        </button>

        <div id="languageMenu" class="language-menu">
            <div onclick="setLanguage('de', this)">
                <svg viewBox="0 0 24 16" class="flag-svg">
                    <rect width="24" height="16" fill="#000"/>
                    <rect width="24" height="10.66" y="5.33" fill="#dd0000"/>
                    <rect width="24" height="5.33" y="10.66" fill="#ffce00"/>
                </svg>
                Deutsch
            </div>
            <div onclick="setLanguage('en', this)">
                <svg viewBox="0 0 24 16" class="flag-svg">
                    <rect width="24" height="16" fill="#012169"/>
                    <rect x="10" width="4" height="16" fill="#fff"/>
                    <rect y="6" width="24" height="4" fill="#fff"/>
                    <rect x="11" width="2" height="16" fill="#C8102E"/>
                    <rect y="7" width="24" height="2" fill="#C8102E"/>
                </svg>
                English
            </div>
            <div onclick="setLanguage('fr', this)">
                <svg viewBox="0 0 24 16" class="flag-svg">
                    <rect width="8" height="16" fill="#0055A4"/>
                    <rect x="8" width="8" height="16" fill="#fff"/>
                    <rect x="16" width="8" height="16" fill="#EF4135"/>
                </svg>
                Français
            </div>
            <div onclick="setLanguage('es', this)">
                <svg viewBox="0 0 24 16" class="flag-svg">
                    <rect width="24" height="16" fill="#AA151B"/>
                    <rect y="4" width="24" height="8" fill="#F1BF00"/>
                </svg>
                Español
            </div>
            <div onclick="setLanguage('cs', this)">
                <svg viewBox="0 0 24 16" class="flag-svg">
                    <rect width="24" height="8" fill="#fff"/>
                    <rect y="8" width="24" height="8" fill="#D7141A"/>
                    <polygon points="0,0 10,8 0,16" fill="#11457E"/>
                </svg>
                Čeština
            </div>
            <div onclick="setLanguage('sq', this)">
                <svg viewBox="0 0 24 16" class="flag-svg">
                    <rect width="24" height="16" fill="#E41E20"/>
                    <circle cx="12" cy="8" r="3" fill="#000"/>
                </svg>
                Shqip
            </div>
        </div>
    </div>
</div>

<!-- App Container -->
<div class="app-container">

    <button class="menu-button quick-option" data-key="Random" onclick="goToGame(this)">
        <svg class="icon" viewBox="0 0 24 24">...</svg>
        <span>Random</span>
    </button>

    <button class="menu-button" data-key="West-East" onclick="goToGame(this)">
        <svg class="icon" viewBox="0 0 24 24">...</svg>
        <span>West-East</span>
    </button>

    <button class="menu-button" data-key="North-South" onclick="goToGame(this)">
        <svg class="icon" viewBox="0 0 24 24">...</svg>
        <span>North-South</span>
    </button>

    <button class="menu-button" data-key="Population" onclick="goToGame(this)">
        <svg class="icon" viewBox="0 0 24 24">...</svg>
        <span>Population</span>
    </button>

    <button class="menu-button" data-key="Area" onclick="goToGame(this)">
        <svg class="icon" viewBox="0 0 24 24">...</svg>
        <span>Area</span>
    </button>

    <button class="menu-button" data-key="Temperature" onclick="goToGame(this)">
        <svg class="icon" viewBox="0 0 24 24">...</svg>
        <span>Temperature</span>
    </button>

</div>

<script src="main-layout.js"></script>
</body>
</html>
