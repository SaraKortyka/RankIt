<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Menu</title>
<!-- Externes CSS -->
<link rel="stylesheet" href="main-layout.css">

</head>
<body>

<!-- ================= HEADER ================= -->
<div class="header">

    <!-- SETTINGS -->
    <div class="settings-container">
        <button class="settings-button" id="settingsBtn">
            <!-- Zahnrad SVG -->
            <svg viewBox="0 0 24 24" width="26" height="26" fill="white">
                <path d="M19.14,12.94a7.49,7.49,0,0,0,.05-.94,7.49,7.49,0,0,0-.05-.94l2.11-1.65a.5.5,0,0,0,.12-.64l-2-3.46a.5.5,0,0,0-.6-.22l-2.49,1a7.28,7.28,0,0,0-1.63-.94l-.38-2.65A.5.5,0,0,0,13.8,2H10.2a.5.5,0,0,0-.49.42L9.33,5.07a7.28,7.28,0,0,0-1.63.94l-2.49-1a.5.5,0,0,0-.6.22l-2,3.46a.5.5,0,0,0,.12.64L4.86,11.06a7.49,7.49,0,0,0-.05.94,7.49,7.49,0,0,0,.05.94L2.75,14.59a.5.5,0,0,0-.12.64l2,3.46a.5.5,0,0,0,.6.22l2.49-1a7.28,7.28,0,0,0,1.63.94l.38,2.65a.5.5,0,0,0,.49.42h3.6a.5.5,0,0,0,.49-.42l.38-2.65a7.28,7.28,0,0,0,1.63-.94l2.49,1a.5.5,0,0,0,.6-.22l2-3.46a.5.5,0,0,0-.12-.64ZM12,15.5A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
            </svg>
        </button>

        <div class="settings-dropdown" id="settingsDropdown">
            
            <!-- Toggle Buttons -->
            <div class="settings-section">
                <button class="toggle" id="physicalToggle">
                    <span id="physicalText"></span>
                    <div class="toggle-circle"></div>
                </button>

                <button class="toggle active" id="koopToggle">
                    <span id="koopText"></span>
                    <div class="toggle-circle"></div>
                </button>
            </div>

            <!-- Radio Group -->
            <div class="radio-section">
                <div class="radio-title" id="continentTitle"></div>

                <label><input type="radio" name="continent" value="World" checked> <span data-key="World"></span></label>
                <label><input type="radio" name="continent" value="Europe"> <span data-key="Europe"></span></label>
                <label><input type="radio" name="continent" value="NorthAmerica"> <span data-key="NorthAmerica"></span></label>
                <label><input type="radio" name="continent" value="SouthAmerica"> <span data-key="SouthAmerica"></span></label>
                <label><input type="radio" name="continent" value="Africa"> <span data-key="Africa"></span></label>
                <label><input type="radio" name="continent" value="Asia"> <span data-key="Asia"></span></label>
            </div>

        </div>
    </div>

    <!-- LANGUAGE -->
    <div class="lang-container">
        <button class="lang-button" id="langBtn"></button>
        <div class="dropdown" id="langDropdown"></div>
    </div>

</div>


<div class="menu" id="menu"></div>

<!-- Externes JS -->
<script src="main-layout.js"></script>
</body>
</html>
